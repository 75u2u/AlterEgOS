name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast: compile PID 1 and the agent natively and cross, run the agent stub.
  # The full Buildroot image build is too slow for every push; it runs by hand
  # (scripts/build.sh) until there is a cached toolchain to reuse here.
  host-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build (x86_64, host)
        run: make host
      - name: Check (aarch64, cross)
        run: make check CC=aarch64-linux-gnu-gcc
      - name: Agent smoke test
        run: |
          state=$(mktemp -d)
          run() { ALTEREGO_STATE="$state" ALTEREGO_PERSONA=buildroot/board/alteregos/rootfs-overlay/etc/alterego/persona.toml ./src/agent/alterego; }
          out=$(printf 'テスト\n疲れたなあ\n眠いなあ\nわたし像を見せて\nexit\n' | run)
          echo "$out"
          echo "$out" | grep -q 'AlterEgo: おはようございます、わたし'
          echo "$out" | grep -q '口癖は「なあ」'
          # the log survives, and a second run picks the learning up again
          test "$(wc -l < "$state/utterances.txt")" = 3
          out=$(printf 'わたし像を見せて\nexit\n' | run)
          echo "$out"
          echo "$out" | grep -q '3 回聞きました'
      - name: Init refuses to run outside PID 1
        run: |
          if ./src/init/alteregos-init; then echo "init should have refused"; exit 1; fi
