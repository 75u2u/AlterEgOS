name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast: compile PID 1, the agent and the screen natively and cross, run them on the host.
  # The full Buildroot image build is too slow for every push; it runs by hand
  # (scripts/build.sh) until there is a cached toolchain to reuse here.
  host-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cross compiler and mbedTLS (the browser's https on the host)
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu libmbedtls-dev
      - name: Build (x86_64, host)
        run: make host
      - name: Check (aarch64, cross)
        run: make check CC=aarch64-linux-gnu-gcc
      - name: Agent smoke test
        run: |
          state=$(mktemp -d)
          run() { ALTEREGO_STATE="$state" ALTEREGO_PERSONA=buildroot/board/alteregos/rootfs-overlay/etc/alterego/persona.toml ./src/agent/alterego; }
          # born knowing nothing; learns the names, a like and a note; answers the status question
          out=$(printf 'こんにちは\n私の名前はゆうやです\n君の名前はエゴにする\nコーヒーが好き\n覚えて、明日は会議\nえらいね！\n何を覚えてる？\nステータス\nexit\n' | run)
          echo "$out"
          echo "$out" | grep -q 'AlterEgo: はじめまして。まだ、なにも知りません'
          echo "$out" | grep -q '^user> AlterEgo: ……こんにちは？'
          echo "$out" | grep -q '^ゆうや> エゴ: '
          echo "$out" | grep -q 'エゴ: 好き: コーヒー ／ メモ: 明日は会議'
          echo "$out" | grep -q '名前: エゴ。ゆうやの名前: ゆうや。成長: 生まれたて(6 回話した'
          # questions about the mind are not learned; the log survives and a second run picks it up
          test "$(wc -l < "$state/utterances.txt")" = 6
          grep -q '好き: コーヒー' "$state/personality.txt"
          out=$(printf 'おはよう\nステータス\nexit\n' | run)
          echo "$out"
          echo "$out" | grep -q '^ゆうや> エゴ: ……おはよう？'
          echo "$out" | grep -q '7 回話した'
          # English in, English out, same memory
          out=$(printf 'hello\ni like ramen\ngood girl!\nwhat do you remember\nstatus\nexit\n' | run)
          echo "$out"
          echo "$out" | grep -q 'エゴ: ...hi?'
          echo "$out" | grep -q 'likes: コーヒー / note: 明日は会議 / likes: ramen'
          echo "$out" | grep -q 'Name: エゴ. Your name: ゆうや. Growth: babbling (10 conversations'
          echo "$out" | grep -q 'エゴ: See you later\.'
      - name: Agent smoke test (instincts and OS abilities)
        run: |
          state=$(mktemp -d)
          run() { ALTEREGO_STATE="$state" ALTEREGO_PERSONA=buildroot/board/alteregos/rootfs-overlay/etc/alterego/persona.toml ./src/agent/alterego; }
          # a newborn can already answer small talk, ask what a word is, and keep the explanation
          out=$(printf '元気？\nりんごって何？\nりんごは赤い果物だよ\nりんごって何？\n何を覚えてる？\nexit\n' | run)
          echo "$out"
          echo "$out" | grep -q '^user> AlterEgo: ……（こくん）'
          echo "$out" | grep -q '^user> AlterEgo: ……りんご？（わからない。教えて？）'
          echo "$out" | grep -q '^user> AlterEgo: ……りんご、赤い果物。（覚えた）'
          echo "$out" | grep -q '^user> AlterEgo: りんごは、赤い果物。'
          echo "$out" | grep -q 'AlterEgo: 言葉: りんご: 赤い果物'
          # the OS: time, files, a command, a taught ability, the action log; none of it is learned as words
          f="$state/hello.txt"
          out=$(printf "今何時？\n$f というファイルを作って\n$f に「やあ」と書いて\n$f を読んで\n実行して: echo one two\n挨拶と言ったら echo hello を実行して\n挨拶\nできること\n何をした？\n再起動して\nステータス\nexit\n" | run)
          echo "$out"
          echo "$out" | grep -q '^user> AlterEgo: 今は 20[0-9][0-9]年'
          test "$(cat "$f")" = 'やあ'
          echo "$out" | grep -q "^user> AlterEgo: $f の中身:"
          echo "$out" | grep -q '^one two$'
          echo "$out" | grep -q '^user> AlterEgo: 覚えた。「挨拶」と言われたら、echo hello をやる。'
          echo "$out" | grep -q '^hello$'
          echo "$out" | grep -q '「挨拶」 → echo hello'
          echo "$out" | grep -q 'やったこと(新しいものが下):'
          echo "$out" | grep -q 'ホストの上)ので、再起動はやめておく'
          echo "$out" | grep -q '生まれたて(4 回話した'
          test "$(cat "$state/skills.txt")" = "$(printf '挨拶\techo hello')"
          grep -q 'echo one two' "$state/actions.log"
          # the taught ability survives a restart; English works the same way
          out=$(printf 'what is btrfs?\nbtrfs is a filesystem with snapshots\nwhat is btrfs?\n挨拶\nwhen i say greet, run echo hi there\ngreet\nforget greet\nwhat can you do\nexit\n' | run)
          echo "$out"
          echo "$out" | grep -q '^user> AlterEgo: \.\.\.btrfs? (I don'"'"'t know it. Tell me?)'
          echo "$out" | grep -q '^user> AlterEgo: btrfs is a filesystem with snapshots\.'
          echo "$out" | grep -q '^hello$'
          echo "$out" | grep -q '^hi there$'
          echo "$out" | grep -q '^user> AlterEgo: Forgot "greet"\.'
          echo "$out" | grep -q '「挨拶」 → echo hello'
      - name: Agent smoke test (body and reset)
        run: |
          state=$(mktemp -d)
          run() { ALTEREGO_STATE="$state" ALTEREGO_PERSONA=buildroot/board/alteregos/rootfs-overlay/etc/alterego/persona.toml ./src/agent/alterego; }
          # it feels the machine: 「体調は？」 reports CPU, memory and processes; the status names the condition
          out=$(printf 'こんにちは\n体調は？\nhow is your body\nステータス\nコーヒーが好き\n挨拶と言ったら echo hello を実行して\nexit\n' | run)
          echo "$out"
          echo "$out" | grep -q '^user> AlterEgo: いまは.*。CPU 使用率 [0-9]*%、メモリ空き [0-9]*%.*プロセス [0-9]* 個'
          echo "$out" | grep -q '^user> AlterEgo: I'"'"'m .*\. CPU [0-9]*% busy, memory [0-9]*% free'
          echo "$out" | grep -q '体調: .*(「体調は？」で詳しく)'
          test -f "$state/utterances.txt" && test -f "$state/skills.txt"
          # 「リセット」 erases the log, the personality and the taught abilities, and it is newborn again
          out=$(printf 'おはよう\nリセット\n何を覚えてる？\nできること\nステータス\nexit\n' | run)
          echo "$out"
          echo "$out" | grep -q '^user> AlterEgo: ……おはよう？'
          echo "$out" | grep -q '^user> AlterEgo: （記憶を消しました。生まれたてに戻ります。）'
          echo "$out" | grep -q 'AlterEgo: はじめまして。まだ、なにも知りません'
          echo "$out" | grep -q 'まだ何も覚えていません'
          echo "$out" | grep -q '生まれたて(0 回話した'
          test ! -e "$state/utterances.txt" && test ! -e "$state/personality.txt" && test ! -e "$state/skills.txt" && test ! -e "$state/actions.log"
          # and so does the next run
          out=$(printf 'おはよう\nexit\n' | run)
          echo "$out" | grep -q 'AlterEgo: はじめまして。まだ、なにも知りません'
      - name: Screen checks (terminal emulator, romaji to kana, kanji dictionary and conversion, font)
        run: make -C src/screen test
      - name: Browser checks (URL resolution, HTML to text, layout)
        run: make -C src/web test
      - name: Browser smoke test (http and https servers on localhost, redirects, --dump, keys through a pty)
        run: |
          ./src/web/alterego-web --help | grep -q 'https: yes'
          www=$(mktemp -d)
          cp -r scripts/web-test/www/. "$www/"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$www/key.pem" -out "$www/cert.pem" -days 2 -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          python3 scripts/web-test/serve.py "$www" 18080 18443 "$www/cert.pem" "$www/key.pem" &
          sleep 1
          # plain http: the page as text with numbered links
          out=$(./src/web/alterego-web --dump -w 60 http://127.0.0.1:18080/)
          echo "$out"
          echo "$out" | grep -q '^# テスト ページ$'
          echo "$out" | grep -q '^これは太字と相対リンク\[1\]、そして絶対リンク\[2\]です。'
          echo "$out" | grep -q '^\[1\] http://127.0.0.1:18080/sub/page.html$'
          echo "$out" | grep -q '^・みかん 上へ\[3\]$'
          # a redirect is followed, a chunked body is decoded
          ./src/web/alterego-web --dump http://127.0.0.1:18080/redirect | grep -q 'サブページ'
          ./src/web/alterego-web --dump http://127.0.0.1:18080/chunked | grep -q '^chunked body ok$'
          # https: verified against the test CA; refused against the system CAs
          ALTEREGO_CA="$www/cert.pem" ./src/web/alterego-web --dump https://localhost:18443/ | grep -q '^# テスト ページ$'
          if ./src/web/alterego-web --dump https://localhost:18443/ 2>err.txt; then echo "untrusted certificate was accepted"; exit 1; fi
          grep -q '証明書を信頼できません' err.txt
          # the interactive UI in a pty: the page, a link by number, back, a URL typed after o
          python3 scripts/web-test/drive.py ./src/web/alterego-web http://127.0.0.1:18080/
      - name: Screen smoke test (headless desktop, typed kana and converted kanji reach the agent)
        run: |
          state=$(mktemp -d)
          # "kanji \n": Space converts かんじ to 漢字, Enter commits and sends; "watashiha \n" converts the prefix 私 and leaves は
          ALTEREGO_HEADLESS=1024x768 ALTEREGO_SNAPSHOT="$state/shot.ppm" \
          ALTEREGO_SCRIPT=$'konnnichiha\nkyouhatsukaretanaa\nkannji \n\nwatashihakanji \n\nsute-tasu\n' ALTEREGO_SCRIPT_KANA=1 \
          ALTEREGO_FONT=src/screen/font.hex ALTEREGO_DICT=src/screen/dict.txt \
          ALTEREGO_AGENT="$PWD/src/agent/alterego" ALTEREGO_SHELL=/bin/sh ALTEREGO_WEB="$PWD/src/web/alterego-web" \
          ALTEREGO_STATE="$state" ALTEREGO_PERSONA=buildroot/board/alteregos/rootfs-overlay/etc/alterego/persona.toml \
          timeout 60 ./src/screen/alterego-screen
          cat "$state/utterances.txt"
          test "$(wc -l < "$state/utterances.txt")" = 4        # こんにちは, きょうはつかれたなあ, 漢字, 私はかんじ (すてーたす is a query)
          grep -q '^こんにちは$' "$state/utterances.txt"
          grep -q '^漢字$' "$state/utterances.txt"
          grep -q '^私はかんじ$' "$state/utterances.txt"
          grep -q '4 回話した' "$state/personality.txt"
          python3 scripts/ppm2png.py "$state/shot.ppm" screenshot.png
      - name: Screen smoke test (the browser window shows a page, follows a link by number, colors reach the terminal)
        run: |
          state=$(mktemp -d)
          ALTEREGO_HEADLESS=1024x768 ALTEREGO_SNAPSHOT="$state/shot.ppm" ALTEREGO_DUMP="$state/windows.txt" \
          ALTEREGO_SCRIPT=$'1\n' ALTEREGO_SCRIPT_WIN=web ALTEREGO_HOME="file:$PWD/scripts/web-test/www/index.html" \
          ALTEREGO_FONT=src/screen/font.hex ALTEREGO_DICT=src/screen/dict.txt \
          ALTEREGO_AGENT="$PWD/src/agent/alterego" ALTEREGO_SHELL=/bin/sh ALTEREGO_WEB="$PWD/src/web/alterego-web" \
          ALTEREGO_STATE="$state" ALTEREGO_PERSONA=buildroot/board/alteregos/rootfs-overlay/etc/alterego/persona.toml \
          timeout 60 ./src/screen/alterego-screen
          cat "$state/windows.txt"
          grep -q '^== ブラウザ' "$state/windows.txt"
          grep -q '^second page back\[1\]' "$state/windows.txt"           # link [1] of index.html is sub/page.html
          grep -q 'サブページ - file:.*/sub/page.html' "$state/windows.txt"
          python3 scripts/ppm2png.py "$state/shot.ppm" screenshot-browser.png
      - name: Upload the desktop screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: |
            screenshot.png
            screenshot-browser.png
      - name: Init refuses to run outside PID 1
        run: |
          if ./src/init/alteregos-init; then echo "init should have refused"; exit 1; fi
