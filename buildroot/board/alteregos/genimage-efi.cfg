# USB / disk image for UEFI PCs. One FAT partition (the EFI System Partition)
# holding the kernel as EFI/BOOT/BOOTX64.EFI. The initramfs is embedded in the
# kernel and the command line is built in, so the firmware boots it directly:
# no GRUB, no config files. post-image.sh stages efi-part/ before this runs.

image efi-part.vfat {
	vfat {
		file EFI {
			image = "efi-part/EFI"
		}
	}
	size = 64M
}

image alteregos-x86_64.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition boot {
		partition-type-uuid = U
		bootable = "true"
		image = "efi-part.vfat"
	}
}
